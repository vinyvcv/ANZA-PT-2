<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(40, 40)">
    <!-- 
      Usando composições de caminhos CW e CCW para recortes matemáticos perfeitos.
      Este SVG é compatível com qualquer software de apresentação ou navegador.
    -->
    <path fill="white" d="
      /* 1. BOLHA EXTERNA (CW) */
      M 110,0 A 110,110 0 1 1 110,220 A 110,110 0 1 1 110,0 Z
      
      /* 2. PRIMEIRO FURO (CCW) */
      M 110,25 A 85,85 0 1 0 110,195 A 85,85 0 1 0 110,25 Z
      
      /* 3. ANEL INTERMOR (CW) */
      M 110,48 A 62,62 0 1 1 110,172 A 62,62 0 1 1 110,48 Z

      /* 4. SEGUNDO FURO (CCW) */
      M 110,72 A 38,38 0 1 0 110,148 A 38,38 0 1 0 110,72 Z

      /* 5. PONTO CENTRAL (CW) */
      M 110,94 A 16,16 0 1 1 110,126 A 16,16 0 1 1 110,94 Z
    " />
    <!-- Ponta do Balão -->
    <path d="M 188,188 L 188,220 L 220,188 Z" fill="white" />
  </g>

  <text x="280" y="180" style="font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 160px; letter-spacing: -6px;" fill="white">anza</text>
  <text x="283" y="225" style="font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 2px;" fill="white">PESQUISA E INTELIGÊNCIA DE DADOS</text>
</svg>
